name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          gradle assembleDebug -Pandroid.useAndroidX=true --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AdbRemoteAssistant_v1.0.2_AutoReconnect.apk
          ls -la app/build/outputs/apk/debug/

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: AdbRemoteAssistant v1.0.2 (心跳保活·智能自愈重连·设备记忆版)
          files: app/build/outputs/apk/debug/AdbRemoteAssistant_v1.0.2_AutoReconnect.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
