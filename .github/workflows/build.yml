name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK
        continue-on-error: true
        run: |
          ./gradlew assembleDebug -Pandroid.useAndroidX=true --stacktrace 2>&1 | tee /tmp/build_log.txt || true
          mkdir -p build_logs
          cp /tmp/build_log.txt build_logs/
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AdbRemoteAssistant_v1.0.3.apk 2>/dev/null || true

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: build_logs/build_log.txt

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: AdbRemoteAssistant v1.0.3 (支持指定位置文件推送与静默安装)
          files: app/build/outputs/apk/debug/AdbRemoteAssistant_v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
