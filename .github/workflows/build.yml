name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          gradle assembleDebug -Pandroid.useAndroidX=true --stacktrace 2>&1 | tee build.log || true
          mkdir -p issue_dump
          grep -C 3 -E ":compile.*Kotlin|e: " build.log > issue_dump/kotlin_err.log || true
          tail -n 250 build.log > issue_dump/tail.log

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diag-dadb-err
          name: Diagnostic Dadb Error
          files: issue_dump/*.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

