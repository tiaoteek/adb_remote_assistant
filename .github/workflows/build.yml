name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        continue-on-error: true
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build.log || true

      - name: Show Log Failure
        run: |
          mkdir -p issue_dump
          head -n 200 build.log > issue_dump/head.log
          tail -n 300 build.log > issue_dump/tail.log

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: issue_dump/





      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diag-log
          name: Diagnostic Build Log
          files: issue_dump/*.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

