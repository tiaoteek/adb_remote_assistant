name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK
        continue-on-error: true
        run: |
          ./gradlew assembleDebug -Pandroid.useAndroidX=true 2>&1 | tee /tmp/build_log.txt || true
          mkdir -p build_logs
          grep -C 5 "e: " /tmp/build_log.txt > build_logs/build_log.txt || tail -n 150 /tmp/build_log.txt > build_logs/build_log.txt
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AdbRemoteAssistant_v1.0.3.apk 2>/dev/null || true

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log-temp
          name: Build Log Temp
          files: build_logs/build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
